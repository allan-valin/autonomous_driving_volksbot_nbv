frontier_explorer:
  ros__parameters:
    navigate_to_pose_action_name: fe_navigate_to_pose

    #This is just a bunch of defaults right now that we don't really need right now
    #They are only there so we can adjust things if needed down the line
    map_topic: /map
    costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap

    global_frame: map
    robot_base_frame: base_footprint

    strategy: nearest
    goal_preemption_enabled: false
    goal_skip_on_blocked_goal: true
    goal_preemption_min_interval_s: 200
    return_to_start_on_complete: false

    occ_threshold: 75 #imposes true strict blocking: blocked(world_point) is true if any active costmap reports cost > OCC_THRESHOLD
    min_frontier_size_cells: 15
    frontier_selection_min_distance: 0.5
    frontier_visit_tolerance: 0.30

    map_qos_durability: transient_local
    map_qos_reliability: reliable
    map_qos_depth: 1
    costmap_qos_reliability: reliable
    costmap_qos_depth: 10
